name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only run `cargo publish --dry-run` (no upload)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    # Optional: create an Environment named "crates-io" in repo Settings to
    # require manual approval before the real publish happens.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag v$tag_version does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Test
        run: cargo test --all-features

      - name: Dry run (packaging check)
        run: cargo publish --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Secret CARGO_REGISTRY_TOKEN is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          cargo publish
